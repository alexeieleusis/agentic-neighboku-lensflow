name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version this template was scaffolded and verified against.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - name: Test with coverage
        run: pnpm coverage

      - name: Verify coverage report exists
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info is missing or empty — the coverage step produced no output"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Cache Storybook build
        uses: actions/cache@v4
        with:
          path: storybook-static
          key: storybook-${{ hashFiles('package.json', 'src/**') }}
          restore-keys: |
            storybook-

      - name: Build Storybook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm build-storybook
