[project]
name = "orchestrate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexei Diaz", email = "alexei.eleusis@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "rich>=13.9",
]

[project.scripts]
orchestrate = "orchestrate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
